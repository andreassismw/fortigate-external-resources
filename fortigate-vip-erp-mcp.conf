# FortiGate VIPs - ERP e MCP
# Substitua wan1 e lan pelas interfaces/zones corretas antes de aplicar.
# ERP: 200.198.25.125:443 -> 10.3.11.100:443
# MCP: 200.198.25.125:20442 -> 10.3.11.102:20442

config firewall vip
    edit "VIP-ERP-HTTPS"
        set extip 200.198.25.125
        set extintf "wan1"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedip "10.3.11.100"
        set mappedport 443
    next
    edit "VIP-MCP-20442"
        set extip 200.198.25.125
        set extintf "wan1"
        set portforward enable
        set protocol tcp
        set extport 20442
        set mappedip "10.3.11.102"
        set mappedport 20442
    next
end

config firewall service custom
    edit "TCP-20442"
        set tcp-portrange 20442
    next
end

config firewall policy
    edit 0
        set name "WAN-ERP-HTTPS"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "VIP-ERP-HTTPS"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat disable
        set logtraffic all
    next
    edit 0
        set name "WAN-MCP-20442"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "VIP-MCP-20442"
        set action accept
        set schedule "always"
        set service "TCP-20442"
        set nat disable
        set logtraffic all
    next
end
